- name: create app user
  user:
      name: roboshop
      create_home: false
      home: /app
      system: true
      shell: /sbin/nologin
      comment: "Roboshop System User"

- name: delete exisiting app directory
  file:
    path: /app
    state: absent

- name: remove {{ component }}.zip
  file:
    path: /tmp/{{ component }}.zip
    state: absent

- name: create app directory
  file:
    path: /app
    state: directory

- name: download {{ component }} zip
  get_url:
    url: "https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/{{ component }}-v4.zip"
    dest: /tmp/{{ component }}.zip            
  

- name: unzip {{ component }} zip
  unarchive:
    src: /tmp/{{ component }}.zip
    dest: /app
    remote_src: yes 