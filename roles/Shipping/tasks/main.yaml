- name: Application setup
  ansible.builtin.include_role:
    name: common
    tasks_from: app-setup

- name: Install Java
  ansible.builtin.include_role:
    name: common
    tasks_from: java

- name: Check the existence of cities data
  ansible.builtin.command: >
    mysql -h "{{ mysql_host }}" -u root -p"{{ mysql_root_password }}" -N -B -e "SELECT COUNT(*) FROM cities.cities;"
  register: cities_count
  ignore_errors: true
  changed_when: false
  
- name: Print cities count
  ansible.builtin.debug:
    var: cities_count.stdout

- name: Load the data into database
  ansible.builtin.shell: >
    mysql -h "{{ mysql_host }}" -u root -p"{{ mysql_root_password }}" < /app/db/master-data.sql
  when: cities_count.rc != 0 or (cities_count.stdout | trim | int == 0)

- name: Create app user in mysql
  ansible.builtin.shell: >
    mysql -h "{{ mysql_host }}" -u root -p"{{ mysql_root_password }}" < /app/db/app-user.sql

- name: Systemd setup
  ansible.builtin.include_role:
    name: common
    tasks_from: systemd-setup

- name: Restart application
  ansible.builtin.include_role:
    name: common
    tasks_from: restart
