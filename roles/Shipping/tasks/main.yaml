- name: application setup
  include_role:
    name: common
    tasks_from: app-setup

- name : install java
  include_role:
    name: common
    tasks_from: java

- name: systemd  setup
  include_role:
    name: common
    tasks_from: systemd-setup  

- name: enable maven 3.9
  command: dnf module enable maven:3.9 -y

- name: install maven and java25
  dnf:
    name:
      - maven
      - java-25-openjdk-devel
      - maven-openjdk25
      - mysql #installing this so that we dont need to set $JAVA_HOME
    state: present

- name: build {{ component }}
  command: mvn clean package
  args:
    chdir: /app

- name: move {{ component }} jar file
  command: mv target/{{ component }}.jar {{ component }}.jar
  args:
    chdir: /app    




- name: restart application
  include_role:
    name: common
    tasks_from: restart
