  #     host: localhost
  #     password: "{{mysql_root_password}}"
  #     check_implicit_admin: yes
  #     state: present

  - name: Set root password for MySQL
    ansible.builtin.command: mysql_secure_installation --set-root-pass{{ vault_mysql_root_password }}