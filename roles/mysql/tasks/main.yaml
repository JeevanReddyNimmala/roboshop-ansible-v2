  - name: task enable mysql 8.4
    command: dnf module enable mysql:8.4 -y

  - name: install mysql
    package:
      name: mysql-server
      state: present

   
  - name: enable and start mysqld
    service:
      name: mysqld
      state: started
      enabled: yes    

  # - name: setup mysql root password
  #   mysql_user:
