- name: create EC2 instances and R54 record 
  hosts: localhost
  connection: local
  vars:
    instances: ["mongodb" , "redis" , "mysql" , "rabbitmq" , "catalogue" , "user" , "payment" , "cart" , "shipping" , "frontend" ]
    action: create
    domain_name: jsrgroup.online
    ami_id: ami-0055977a6e828a4f4
  tasks:
    - name: create ec2 instances
      amazon.aws.ec2_instance:
        name: "roboshop-{{ item }}"
        image_id: "{{ ami_id }}"
        instance_type: t3.micro
        region: us-east-1
        security_groups:
        - Roboshop-common
        - "roboshop-{{ item }}"
      loop: "{{ instances }}"
      when: action == "create"
      register: ec2_output
    
    # - name: print the ec2 output
    #   debug:
    #     msg: "{{ ec2_output }}"
    - name: create R53 record
      amazon.aws.route53:
        state: present
        zone: "{{ domain_name }}"
        record: "{{ item.item }}.{{ domain_name }}"
        type: A
        ttl: 1
        value: "{{ item.instances[0].private_ip_address }}"
        overwrite: yes
      loop: "{{ ec2_output.results }}"
      when: action == "create"


    - name: create R53 record for frontend
      amazon.aws.route53:
        state: present
        zone: "{{ domain_name }}"
        record: "{{ domain_name }}"
        type: A
        ttl: 1
        value: "{{ item.instances[0].public_ip_address }}"
        overwrite: yes
      loop: "{{ ec2_output.results }}"
      when: action == "create" and item.item == "frontend"

    - name: delete r53 record
      amazon.aws.route53:
        state: absent
        zone: "{{ domain_name }}"
        record: "{{ item }}.{{ domain_name }}"
        type: A
        ttl: 1
      loop: "{{ instances }}"
      when: action == "delete" 

    - name: delete r53 record for frontend
      amazon.aws.route53:
        state: absent
        zone: "{{ domain_name }}"
        record: "{{ domain_name }}"
        type: A
        ttl: 1
      loop: "{{ instances }}"
      when: action == "delete" and item == "frontend"  

    - name: delete ec2 instances
      amazon.aws.ec2_instance:
        state: absent
        name: "roboshop-{{ item }}"
        region: us-east-1
        wait: yes
      loop: "{{ instances }}"
      when: action == "delete"  